services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest   # pin a version for production use
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    ports:
      - "8000:8000"

volumes:
  mlflow-data:
